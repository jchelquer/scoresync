Anotaciones globales y por parte: el owner de la obra puede hacer anotaciones globales. El owner de la parte puede hacer anotaciones en las partes y también sirven para todos los usuarios. Cada usuario puede hacer anotaciones privadas en la parte que ensaya. Las anotaciones se pueden encender o apagar.
