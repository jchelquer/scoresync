#Movimientos con pausas reales entre sí: CONSTRUIDO 30/07 (sin deployar todavía) — tipo "pausa" en EfectoTempo (Notación, con duración estimada), fila de cierre interna en el Itinerario (tiempo real tapeado), freno de renumeración en el umbral (ajuste_barras + guardar_compases_pagina — de paso corrigió un bug real de renumeración que ya existía), salto anticipado de vista en Sincronizar compases. Quedó pendiente (deliberadamente, por riesgo de tocar sin poder probar en navegador real): el mismo salto de vista en el Navegador de ejecución en vivo, y que la cuenta "compases al aire" se dispare también antes de que termine una pausa.

#Creo Partes con tacet: una parte puede no tener un movimiento entero. Probé simular con un compás de multirest grande pero no quedó bien — pensar una solución mejor.

#Entender cuándo se recalcula el plan de tiempos: no tengo claro cuándo se reenvía/recalcula el plan de ejecución (plan_obra/construir_plan) — a veces siento que compases bien temporizados "se corren" solos. No necesariamente es un bug, puede ser que sólo falte que se entienda el ciclo.

#Compás estirado por salto espacial (sin pausa real): DECIDIDO 31/07, no vale la pena resolverlo. Mecanismo: el ancho de un compás se define como "hasta donde empieza el siguiente ancla", así que un hueco visual sin corte real de ejecución (p.ej. fin de sistema con espacio antes de que empiece otro trozo) queda adosado al compás anterior y los pulsos se dibujan repartidos en ese hueco — no es grave, sólo se ven en un lugar raro. Se evaluaron: ancla nueva de "corte de contenido" real, handle manual por compás (campo nullable en Compás o tabla aparte), heurística automática de ancho anómalo — todas suman complejidad (modelo o rendering) para un caso raro. Si algún día molesta puntualmente, la salida más barata es recomponer la partitura impresa para evitar el salto.

Plica/ledger-line como falso positivo en detección de barras: teoría propia (22/07) de que una nota muy aguda o grave (con varios ledger lines) puede hacer que un plica se detecte como si fuera una barra real. No verificada todavía contra una imagen real.

#Anacrusis: DECIDIDO 31/07, no hace falta cambiar nada — alcanza con poner un número de compás que no esté impreso en la partitura (p.ej. 0) con la duración que corresponda, directamente en Itinerario y Notación, como cualquier otro compás.

