# Changelog de ScoreSync
# El primero de la lista es la versión actual.
# Tipos: nuevo | mejorado | corregido
- version: "1.31.6"
  date: "2026-08-09"
  changes:
    - type: corregido
      text: "El conteo de compases al aire (antes de arrancar la ejecución) sonaba al tempo teórico marcado en el itinerario/Notación en vez del real — ahora suena a la duración real y medida del primer compás que se va a ejecutar."
- version: "1.31.5"
  date: "2026-08-08"
  changes:
    - type: corregido
      text: "En la ficha de una parte sin compases confirmados, el botón \"Practicar\" igual aparecía — al elegirla no pasaba nada (el navegador la descarta en silencio y muestra otra parte, o ninguna). Ahora se oculta y explica qué falta."
- version: "1.31.4"
  date: "2026-08-08"
  changes:
    - type: nuevo
      text: "En la lista de \"Partes\" de una obra, cada una muestra ahora quién es su dueño (\"mía\" si es tuya)."
    - type: mejorado
      text: "En los desplegables de \"Transferir a…\" (obra y parte), cada usuario ahora se ve con su grupo entre paréntesis, y sólo aparecen usuarios que comparten al menos un grupo con vos — antes cualquier dueño podía transferirle a cualquiera que ya tuviera algo propio en ScoreSync, sin relación con los grupos."
- version: "1.31.3"
  date: "2026-08-08"
  changes:
    - type: corregido
      text: "El último pulso de una obra podía quedar sin temporización real por un residuo de redondeo de punto flotante (dos formas de calcular la misma posición que no coincidían en el último bit) — bloqueaba publicar aunque todos los compases tuvieran su tiempo marcado. Se agregó una tolerancia mínima a la comparación."
- version: "1.31.2"
  date: "2026-08-08"
  changes:
    - type: corregido
      text: "En la ficha de una obra, el texto que explica por qué todavía no se puede publicar era invisible (colores por defecto de Bootstrap sobre el fondo oscuro de la pantalla)."
    - type: mejorado
      text: "Ese mensaje ahora dice exactamente qué le falta a la obra (itinerario, compases confirmados, tempo en \"Notación\", o anclaje de tiempos en \"Sincronizar compases\") en vez de un texto fijo con los tres requisitos completos."
    - type: nuevo
      text: "En la lista de \"Partes\" de una obra, cada una muestra ahora si ya está \"Preparada\" (compases confirmados) o si todavía le falta confirmarlos."
- version: "1.31.1"
  date: "2026-08-08"
  changes:
    - type: nuevo
      text: "La sección \"Repertorios\" ahora también permite crear un repertorio nuevo y renombrar uno existente desde la misma pantalla, no sólo elegir sus grupos visibles."
    - type: corregido
      text: "En la pantalla de Visibilidad de una obra, un comentario interno se mostraba como texto en la página en vez de quedar oculto."
    - type: corregido
      text: "En \"Repertorios\", la tabla se veía con fondo y letras oscuras difíciles de leer sobre el fondo oscuro de la pantalla."
- version: "1.31.0"
  date: "2026-08-08"
  changes:
    - type: nuevo
      text: "Ahora se puede restringir quién ve una obra o un repertorio completo según el grupo del usuario (o usuarios puntuales) — antes cualquier usuario logueado veía todas las obras publicadas."
    - type: nuevo
      text: "Nueva pantalla \"Visibilidad\" en la ficha de cada obra (botón con candado, junto al de editar) para elegirla pública, que herede la regla de su repertorio, o restringirla a grupos/usuarios puntuales."
    - type: nuevo
      text: "Nueva sección \"Repertorios\" en el menú (sólo para admins) para elegir qué grupos ven cada repertorio — vacío sigue siendo público, como siempre."
    - type: mejorado
      text: "El filtro de repertorio en la biblioteca ahora sólo ofrece los repertorios que el usuario puede ver."
- version: "1.30.0"
  date: "2026-08-03"
  changes:
    - type: nuevo
      text: "Se agregó la aceptación de Términos y Condiciones y Política de Privacidad. Si tu cuenta todavía no aceptó la versión vigente, te redirige a una página centralizada en infedu.com.ar para leerlos y aceptar — después te trae de vuelta exactamente a donde estabas."
- version: "1.28.0"
  date: "2026-08-01"
  changes:
    - type: mejorado
      text: "Reforma del \"modo compás\" (Practicar sin partitura, pensado sobre todo para el celular): botones y controles bastante más grandes para tocar con el dedo, y el cuadro central (metrónomo/número de compás/indicaciones) más chico para dejarles lugar."
    - type: mejorado
      text: "Los números de compás y \"vez\" (desde/hasta) ahora se ven centrados y en negrita, con la caja de \"vez\" resaltada en verde claro — vale tanto en modo compás como en modo partitura."
    - type: mejorado
      text: "El desplegable de parte (\"Score\") se ve en negrita en las dos pantallas."
- version: "1.27.0"
  date: "2026-07-31"
  changes:
    - type: nuevo
      text: "En la ficha de una obra, junto al audio de referencia, ahora se puede indicar la versión (quién toca) y un enlace opcional a su origen — el enlace es clickeable y se abre en una pestaña nueva."
- version: "1.26.1"
  date: "2026-07-31"
  changes:
    - type: mejorado
      text: "Exportar PDF genera un archivo mucho más liviano (y más rápido) — las páginas se comprimen como JPEG en vez de PNG sin pérdida, manteniendo el color de las marcas y anotaciones."
- version: "1.26.0"
  date: "2026-07-31"
  changes:
    - type: nuevo
      text: "Transferir ownership: el dueño de una obra o parte (o un admin) puede entregársela a otro usuario desde su propia ficha, con confirmación explícita. El nombre del propietario actual ahora se ve siempre ahí (\"Temporización\"/\"Preparación\"), y también en el selector de partes y junto al título en Practicar."
    - type: corregido
      text: "Un admin ya puede editar, transferir o borrar cualquier obra o parte aunque no sea su dueño, en toda la app (antes varias pantallas del pipeline de edición sólo dejaban entrar al dueño exacto)."
    - type: corregido
      text: "En Ajuste de ancla, la acción \"Buscar\" podía dejar las barras y compases de esa página marcados como confirmados con datos viejos (calculados contra el ancla anterior) — ahora se invalidan correctamente, igual que ya hacían \"Confirmar\" y \"Volver a detectar\"."
    - type: mejorado
      text: "El nombre de la parte (instrumento/parte) pasó a ser un subtítulo grande debajo del título, en vez de texto chico dentro de la ficha."
    - type: nuevo
      text: "Se ven en Practicar los saltos del itinerario (repetición, D.C./D.S., lo que sea): una marca de color sobre la barra de compás en el punto de partida y otra, del mismo color más claro, en el de llegada. Mismo toggle que los avisos, y se incluyen en Exportar PDF."
- version: "1.24.0"
  date: "2026-07-31"
  changes:
    - type: nuevo
      text: "Ajuste de barras: nuevo control \"Margen izquierdo de contenido (todos los sistemas)\" — un slider que empuja de un saque el arranque del primer compás de cada sistema de la página (para dejar afuera la clave/armadura), en vez de tener que reubicarlo sistema por sistema. Las correcciones locales de siempre siguen funcionando después, sistema por sistema."
- version: "1.23.1"
  date: "2026-07-31"
  changes:
    - type: mejorado
      text: "El fondo de color de los avisos de cambio y las anotaciones ahora es más claro (más pastel), para que se lean mejor sobre la partitura."
    - type: mejorado
      text: "Al hacer clic en un número de compás para editarlo (en Ajuste de barras), la cajita de edición ahora muestra primero las repeticiones (lo que se edita con más frecuencia) y después el número de compás, con las repeticiones ya seleccionadas para escribir directo."
    - type: mejorado
      text: "El botón \"Practicar\" en la pantalla de una parte ahora está destacado arriba de todo, igual que en la pantalla de la obra."
- version: "1.23.0"
  date: "2026-07-31"
  changes:
    - type: nuevo
      text: "Nuevo botón \"📄 Exportar PDF\" en Practicar: descarga la parte que estás siguiendo como PDF, página completa (con título y pie, no sólo el pentagrama), con los números de compás/avisos/rampas de tempo/anotaciones que estén visibles en ese momento — sin el recuadro del compás en ejecución, que es sólo de la pantalla."
    - type: mejorado
      text: "El tamaño de los números de compás, avisos, rampas de tempo y anotaciones ahora acompaña el zoom (y la resolución del PDF exportado) en vez de quedar fijo en un tamaño de pantalla — antes se veían cada vez más chicos en proporción cuanto más se acercaba el zoom, o en el PDF."
- version: "1.22.4"
  date: "2026-07-30"
  changes:
    - type: nuevo
      text: "Anotaciones: ahora se puede anclar una a un punto exacto de la partitura (por ejemplo, sobre una nota puntual) en vez de al compás entero — un candado \"🔒 Anclar a este punto exacto\" al crearla. Se ve justo ahí, sin acomodo automático (a propósito, para que quede pegada a la nota)."
    - type: corregido
      text: "El texto de una anotación podía quedar invisible (recortado fuera de la pantalla) en el último compás de un sistema angosto, con más razón a mayor zoom — ya no."
    - type: mejorado
      text: "El color de las anotaciones privadas pasó de gris a violeta (se leía mal el gris sobre el fondo del editor); \"arriba\"/\"abajo\" en el editor ya no se ven en negro."
    - type: mejorado
      text: "El editor de anotaciones cierra apenas se aprieta Guardar, sin esperar a la red."
- version: "1.22.1"
  date: "2026-07-30"
  changes:
    - type: nuevo
      text: "Ahora se ve en Practicar dónde hay un accelerando o un rallentando: una raya punteada con la etiqueta \"accel.\"/\"rall.\" muestra el tramo, arriba del pentagrama, junto con el resto de los avisos de cambio."
    - type: mejorado
      text: "\"Ritardando\" pasó a llamarse \"Rallentando\" en toda la app (el término más frecuente en la práctica)."
    - type: mejorado
      text: "El texto de los avisos de cambio y de las anotaciones ahora es gris (oscuro sobre fondos de color, claro sobre fondos grises) en vez de blanco o negro puro, para no confundirse con la tinta real de la partitura."
- version: "1.22.0"
  date: "2026-07-30"
  changes:
    - type: nuevo
      text: "Anotaciones: ahora se puede dejar carteles de texto anclados a un compás, directamente sobre la partitura en Practicar (botón \"Anotar\") — de obra (las pone el dueño de la obra, las ve todo el mundo), de parte (las pone el dueño de esa parte) o privadas (cada usuario las suyas, en cualquier parte que practique, sea o no suya). Se pueden ubicar arriba o abajo del pentagrama, arrastrar para reubicarlas sin perder el texto, y tienen un color distinto según el nivel."
    - type: corregido
      text: "Se corrigió un aviso de cambio de tempo duplicado: si el itinerario vuelve a pasar por un compás en una repetición, el aviso ya no se muestra dos veces superpuesto."
- version: "1.21.0"
  date: "2026-07-30"
  changes:
    - type: nuevo
      text: "Cuando una parte no tiene un compás (por ejemplo, un movimiento entero que no toca), Practicar ya no se queda congelado mostrando un error: se detiene, avisa qué rango falta y deja el punto de partida listo en el próximo compás real de esa parte."
    - type: nuevo
      text: "En Sincronizar compases, nuevo botón \"Seleccionar todo\" — junto con Interpolar, sirve para revisar de punta a punta si algún tapeo quedó con el tiempo real invertido (yendo hacia atrás), en vez de tener que buscarlo a mano."
    - type: mejorado
      text: "El botón \"Continuar\" en Practicar ahora tiene un ícono distinto (⏯) al de \"Ejecutar\" (▶), para no confundirlos de un vistazo."
- version: "1.20.1"
  date: "2026-07-30"
  changes:
    - type: mejorado
      text: "La fila de pausa en el Itinerario ahora se marca con el mismo número que ya se cargó en Notación (Desde = ese número, Hasta vacío) en vez de dejar los dos campos vacíos — antes no tenía ninguna relación visible con la pausa correspondiente. Se resalta con un color de fondo distinto en Itinerario y en Sincronizar compases, y cada pantalla avisa si le falta su contraparte en la otra."
- version: "1.20.0"
  date: "2026-07-30"
  changes:
    - type: nuevo
      text: "Pausas reales entre movimientos: en Notación se puede marcar una pausa (con duración estimada, tipo \"Pausa\") y en el Itinerario agregar una fila para tapear en Sincronizar compases cuándo termina de verdad el movimiento anterior. Antes no había forma de representar un silencio real entre dos tramos, y el último compás antes del corte podía quedar mal temporizado."
    - type: mejorado
      text: "En Sincronizar compases, durante el silencio de una pausa la vista de la partitura salta directo al próximo compás real en vez de quedarse mostrando el final del tramo anterior."
    - type: corregido
      text: "Se corrigió un bug real de numeración de compases: reconfirmar barras en una página anterior podía correr en silencio la numeración manual de un movimiento siguiente (por ejemplo, el \"201\" del arranque de un segundo movimiento)."
- version: "1.19.3"
  date: "2026-07-29"
  changes:
    - type: corregido
      text: "En Sincronizar compases, \"Reiniciar\"/Play (modo Reproducción) podía volver al principio de la obra sin explicación cuando el primer compás del rango elegido no tenía tiempo real propio — ahora cae en el compás con tiempo real más cercano hacia atrás, y avisa cuando eso pasa."
- version: "1.19.2"
  date: "2026-07-29"
  changes:
    - type: mejorado
      text: "Al guardar en Itinerario o en Notación ahora aparece un mensaje de confirmación, en vez de volver a la pantalla sin ningún aviso."
- version: "1.19.1"
  date: "2026-07-29"
  changes:
    - type: mejorado
      text: "Al crear una obra nueva ahora se puede elegir de una vez el repertorio-ciclo, sin tener que editarla después."
- version: "1.19.0"
  date: "2026-07-29"
  changes:
    - type: nuevo
      text: "ScoreSync ahora está disponible en inglés — el selector de idioma (ES/EN) está en el menú de usuario, arriba a la derecha."
- version: "1.18.0"
  date: "2026-07-29"
  changes:
    - type: nuevo
      text: "Ayuda contextual (botón \"?\") en todas las pantallas: Practicar, Itinerario, Notación, Sincronizar compases, las cinco de preparación de partitura (orientación, márgenes, sistemas, ancla, barras), Biblioteca y la ficha de la obra."
    - type: mejorado
      text: "En varias pantallas de preparación (barras, sistemas, ancla) se sacaron los párrafos de ayuda que quedaban siempre visibles en el panel — ahora viven en el botón \"?\", dejando el panel más despejado."
    - type: corregido
      text: "La ayuda de \"Sincronizar por compás\" estaba desactualizada — todavía mencionaba la sincronización por itinerario (ya eliminada) y no describía Ajuste fino, Interpolar, Borrar temporización ni Ajustar pulsos. Actualizada, junto con un tooltip de \"Reiniciar\" que decía lo contrario de lo que hace en modo Marcado."
- version: "1.17.0"
  date: "2026-07-29"
  changes:
    - type: mejorado
      text: "Se eliminó la sincronización \"por itinerario\" (la pantalla \"Sincronizar itinerario\" y el selector de Temporización en el navegador) — había quedado sin uso desde que existe la sincronización fina por compases, y sólo generaba confusión. La fila \"fin de la obra\" de \"Sincronizar compases\" sigue funcionando igual que antes."
    - type: corregido
      text: "En la ficha de la obra, el selector de audio ya no muestra el confuso texto nativo del navegador (\"ningún archivo seleccionado\") — ahora es un botón claro que dice \"Elegir archivo\" o \"Elegir otro archivo\" según corresponda."
- version: "1.16.0"
  date: "2026-07-28"
  changes:
    - type: nuevo
      text: "Durante la ejecución, ahora se puede prender avisos que muestren eventos importantes (cambios de compás, armadura de clave, tempo)"
    - type: mejorado
      text: "La armadura de clave mostrada se adapta automáticamente a la traspoción del instrumento para el que fue hecha la parte."
- version: "1.15.10"
  date: "2026-07-28"
  changes:
    - type: corregido
      text: "En \"Ajuste de barras\", un sistema sin ninguna barra real en el medio (un compás único con multirest completo) no numeraba nada, aunque sus dos bordes de sistema estuvieran bien detectados — y agregarle una barra a mano de golpe renumeraba toda la página. La causa: el cierre virtual contra el borde de sistema no se contaba cuando no había ninguna barra aceptada. Corregido — ese sistema ahora siempre tiene su compás de cierre."
    - type: corregido
      text: "En \"Ajuste de barras\", borrar varias barras seleccionadas de una (rectángulo de selección + Borrar) resecuenciaba toda la página en vez de sólo lo que sigue del borrado — podía pisar en silencio una renumeración manual anterior (p.ej. el arranque de un movimiento). Ahora un borrado en bloque, sea de la cantidad que sea, sólo recalcula desde el primer punto de cambio en adelante."
    - type: corregido
      text: "En \"Ajuste de barras\", simplemente volver a entrar a una página YA CONFIRMADA (sin editar nada) podía perder en silencio un multirest puesto justo en el último compás de un sistema, y pisar con numeración plana cualquier renumeración manual posterior — un problema de vinculación al cargar la página, no de edición. Corregido."
    - type: corregido
      text: "En \"Sincronizar compases\", elegir un rango (Shift+click o los campos de Rango) en modo marcado armaba a veces el primer compás del bloque en vez del último — inconsistente con Reiniciar, que ya armaba el último. Ahora las tres vías arman siempre el último en marcado (seguís tapeando desde ahí) y el primero en reproducción (se escucha desde el principio)."

- version: "1.15.9"
  date: "2026-07-28"
  changes:
    - type: mejorado
      text: "\"Sincronizar compases\" bastante más compacta: se sacó el texto \"Marcando el compás X\" (ya hay guías visuales en la lista y en la partitura); la info de indicación/armadura/bpm de cada compás pasó a la misma fila que su número (antes ocupaba una fila aparte); se sacaron \"calc.\" y sus dos valores calculados (quedó el bpm real medido, que es el útil); \"N compases seleccionados\" se sacó de al lado de Ajuste fino."
    - type: mejorado
      text: "Los botones Marcado/Reproducción se movieron a la fila del Play (antes de él), abreviados \"Marc.\"/\"Repr.\"; el botón Marcar quedó del mismo alto que Saltear/Deshacer, destacado por fondo en vez de por tamaño; Interpolar y Borrar temporización se unieron a la fila de Ajuste fino, y Borrar temporización pasó a ícono (🕒✕) para ocupar menos lugar."
    - type: mejorado
      text: "El selector de Rango se movió arriba, a la fila del switch \"Mostrar números de compás\" y los botones ▲/▼ de ventana (alineados entre sí); ya no tiene flechitas de subir/bajar ni botón Aplicar aparte — cualquier cambio en sus campos aplica el rango solo. El campo \"vez\" quedó bien angosto (siempre es 1 dígito)."
    - type: nuevo
      text: "En \"Sincronizar compases\", además de los botones ▲/▼ ahora se puede arrastrar (mouse, touch o lápiz) directamente sobre la partitura para mover la ventana de sistemas un paso por cada tanto de arrastre — sin tener que ir a buscar los botones."
    - type: mejorado
      text: "El pie de página del sitio (logo, versión, Novedades) se sacó de \"Sincronizar compases\" — quedaba muy lejos y obligaba a scrollear de más — y su contenido se reubicó al pie de la columna de la partitura, arriba de todo. El resto de las pantallas no cambia."
    - type: mejorado
      text: "La lista de compases de \"Sincronizar compases\" es un poco más baja (de 60vh a 56vh) para que la pantalla entre mejor sin scroll en pantallas más chicas."

- version: "1.15.8"
  date: "2026-07-28"
  changes:
    - type: mejorado
      text: "En \"Sincronizar compases\": el texto de ayuda inicial (largo) pasó a un pop-up con botón \"?\" junto a \"Volver a la obra\", liberando espacio. Se sacaron los botones de avance/retroceso de audio en 1s y 0,1s (seguían disponibles por teclado con las flechas); el slider de velocidad se movió a la fila de Play/Reiniciar."
    - type: mejorado
      text: "En \"Sincronizar compases\", tocar Marcado o Reproducción también arranca el audio si estaba pausado — marcar es también \"empezar (o seguir) a marcar\", sin tener que tocar Play aparte."

- version: "1.15.7"
  date: "2026-07-28"
  changes:
    - type: corregido
      text: "La detección de sistemas perdía o fusionaba sistemas reales en partituras con mucho texto de expresión/adornos entre pentagramas (el umbral para considerar una franja \"vacía\" era demasiado estricto) — en un caso real llegaba a detectar 4 de 11 sistemas por página. Nuevo valor por defecto, mucho más tolerante."
    - type: nuevo
      text: "Umbral de separación entre sistemas ajustable por página, con un control deslizante (junto a \"Volver a detectar de cero\" en Ajuste de sistemas) — mismo criterio que el umbral de contenido de sistema, que también pasó a ser deslizante."

- version: "1.15.6"
  date: "2026-07-27"
  changes:
    - type: corregido
      text: "En \"Ajuste de barras\", un clic entre la última barra aceptada y una marca azul de cierre ya puesta se interpretaba siempre como \"mover esa marca ahí\" — impedía agregar una barra faltante en esa zona. Ahora reubicar sólo pasa si no hay ya una marca azul puesta (recién descartada, o nunca detectada); si ya hay una, cualquier otro clic agrega una barra real, como en cualquier otro lugar del sistema."

- version: "1.15.5"
  date: "2026-07-27"
  changes:
    - type: corregido
      text: "En \"Sincronizar compases\", el botón Reiniciar (modo marcado) armaba el primer compás de la selección en vez del último, al revés de lo que ya hace Shift+click al seleccionar un rango — quedaba inconsistente."

- version: "1.15.4"
  date: "2026-07-27"
  changes:
    - type: mejorado
      text: "En \"Sincronizar compases\", el botón para ajustar pulsos ya no aparece en todos los compases — sólo en los que tienen un calderón o son parte de un accelerando/ritardando, que es donde el cálculo automático puede desviarse de lo real. Limpia la lista en obras sin esos efectos."

- version: "1.15.3"
  date: "2026-07-27"
  changes:
    - type: mejorado
      text: "Las imágenes de página normalizadas (rotación/enderezado aplicados) ahora se cachean en el servidor en vez de recalcularse en cada visita — evita reprocesar innecesariamente cuando se navega entre obras, más liviano para el servidor."

- version: "1.15.2"
  date: "2026-07-27"
  changes:
    - type: corregido
      text: "En \"Sincronizar compases\", un compás que todavía no tenía el tempo cargado en Notación (aunque sí la indicación de compás) se mostraba como \"hasta pulso 1\" en vez de como un compás entero — quedaba marcado como si se cortara a mitad de camino sin ser el caso."

- version: "1.15.1"
  date: "2026-07-27"
  changes:
    - type: mejorado
      text: "En \"Ajuste de barras\", la marca de comienzo/cierre de sistema (línea azul) ahora se corrige de un solo clic en el lugar correcto en vez de quedar pegada al margen de página si la detección automática se equivocaba y se descartaba — antes no había forma de indicar dónde arranca/termina de verdad, y la corrección se perdía al recargar la página; ahora queda guardada."

- version: "1.15.0"
  date: "2026-07-27"
  changes:
    - type: nuevo
      text: "En \"Notación\", nueva sección de efectos de tempo: accelerando, ritardando y calderón, ubicados por compás (y opcionalmente pulso) — reemplazan lo que antes se cargaba como Tempo/BPM llegada en el itinerario, que dependía de en qué fila estaban escritos. Ahora un accelerando puede empezar a mitad de una fila y terminar a mitad de la fila siguiente sin cortarse en el borde."
    - type: mejorado
      text: "El itinerario ya no tiene columnas de Tempo ni BPM llegada — se cargan en Notación, junto con Indicación/Armadura/BPM base."
    - type: nuevo
      text: "En \"Sincronizar compases\", cada compás tiene un botón para ajustar la posición real de un pulso individual arrastrando un punto mientras se reproduce el audio (con una barra de referencia a velocidad constante como ayuda) — para corregir casos puntuales donde el cálculo automático no cae exactamente donde se escucha en la grabación."
    - type: corregido
      text: "El último compás de cada sistema ya no se muestra ni se recorta estirado hasta el margen de la página al practicar o sincronizar por compases — usa el borde real de cierre del sistema, que ya se detectaba bien desde la pantalla de Ajuste de barras pero no se aprovechaba acá."

- version: "1.14.1"
  date: "2026-07-26"
  changes:
    - type: nuevo
      text: "Botón \"Editar\" en la ficha de la obra (dueño o admin) para corregir título, compositor, arreglista y ciclo — antes sólo se podía hacer desde el panel de administración."

- version: "1.14.0"
  date: "2026-07-26"
  changes:
    - type: nuevo
      text: "Repertorio y Ciclo para organizar la biblioteca (p. ej. las obras de una banda, sub-agrupadas por año) — cada obra puede asignarse a un ciclo. Se gestionan desde el panel de administración."
    - type: nuevo
      text: "Filtros en la biblioteca: búsqueda libre, compositor, arreglista, repertorio, ciclo y publicada/no."
    - type: nuevo
      text: "Orden en la biblioteca: por título, por compositor, o por repertorio/ciclo (y dentro de eso, título y compositor)."

- version: "1.13.0"
  date: "2026-07-26"
  changes:
    - type: nuevo
      text: "En \"Sincronizar compases\", ahora se puede elegir compás haciendo clic directo en la partitura (antes sólo desde la lista) — funciona en modo marcado y en reproducción, con Shift+click para seleccionar un rango igual que en la lista."
    - type: nuevo
      text: "En \"Sincronizar compases\", nuevo selector de rango (\"desde compás/vez — hasta compás/vez\") como una tercera forma de elegir compases, sincronizada con la lista y con la partitura: elegir por cualquiera de las tres vías se refleja en las otras dos."
    - type: nuevo
      text: "En \"Sincronizar compases\", botones ↑/↓ junto a la partitura para pasear la ventana un sistema por vez y buscar un compás visualmente, sin tocar la selección vigente — un clic posterior (en la lista o en la partitura) hace que la ventana vuelva a seguirla."
    - type: mejorado
      text: "Al practicar, un clic en la partitura mientras el reproductor está detenido ya no se ignora — escribe directamente \"desde c.\" en el rango (que a su vez reposiciona la vista previa); tipear \"desde c.\" a mano también reposiciona la partitura."
    - type: mejorado
      text: "En la lista de compases, el bpm real calculado se lee más claro: \"88 bpm | 91 real\" en vez de \"88 bpm bpm real:91\"."

- version: "1.12.0"
  date: "2026-07-26"
  changes:
    - type: corregido
      text: "La indicación de compás, la armadura y el tempo ahora se resuelven compás a compás dentro de una fila del itinerario, no una sola vez al principio de la fila — si dentro de una fila larga cambiaba alguno de estos a mitad de camino (p. ej. un cambio de tempo en el compás 10 de una fila que arranca en el compás 1), antes quedaba ignorado hasta la fila siguiente. Se nota tanto practicando como sincronizando por compases."
    - type: corregido
      text: "Al entrar directo a un compás donde cambia la indicación/armadura/tempo (por link, o al recomenzar ahí), el encabezado ya muestra el valor correcto desde el primer instante, sin esperar a Ejecutar."
    - type: nuevo
      text: "Botón Reiniciar también disponible en modo marcado de \"Sincronizar compases\" (antes sólo estaba en modo reproducción)."
    - type: mejorado
      text: "En \"Sincronizar compases\", los compases interpolados o todavía sin marcar se ven con un fondo más claro, para distinguirlos de un vistazo de los ya confirmados."
    - type: mejorado
      text: "La ventana del pentagrama (practicando y sincronizando por compases) ya no cae en el margen de la página cuando arranca o termina justo en un sistema — se extiende un alto de sistema hacia atrás/adelante para no cortar en medio de un título o una marca de edición."
    - type: mejorado
      text: "Al practicar con audio cargado, el modo \"con audio\" arranca activado por default."
    - type: nuevo
      text: "Detección automática de dónde arranca y termina realmente cada sistema (más allá del margen de página) al ajustar barras — el primer compás ya no arranca en el margen sino después de la clave/armadura, y el último ya no deja una barra ni un compás vacío de más cuando ya cierra bien con una barra real seguida de blanco. Ajustable por página (útil en páginas escaneadas con ruido de fondo) desde la pantalla de Ajuste de barras."

- version: "1.11.0"
  date: "2026-07-26"
  changes:
    - type: nuevo
      text: "Pantalla nueva \"Notación\" (junto a Itinerario/Sincronizar en la ficha de la obra): ahí se cargan ahora la indicación de compás, la armadura (nuevo) y el tempo base — cada uno como una marca a partir de un compás, vigente en cualquier repetición, en vez de depender de la fila del itinerario en la que se cargó. Antes, una repetición lejana podía llegar a heredar la indicación/tempo de lo que sonaba justo antes del salto en vez de la propia del pasaje — con esto queda resuelto de raíz."
    - type: nuevo
      text: "La armadura se muestra ahora durante la práctica (junto a la indicación de compás/bpm) y en \"Sincronizar compases\"."
    - type: mejorado
      text: "El itinerario ya no tiene columnas de Indicación ni BPM de arranque (se cargan en Notación) — sigue teniendo Tempo/BPM llegada, que es genuinamente del tramo (accelerando/ritardando puntual), no de la partitura en general."

- version: "1.10.4"
  date: "2026-07-25"
  changes:
    - type: mejorado
      text: "Para poder publicar una obra ahora también hace falta que la temporización \"por compases\" esté completa (ningún compás del itinerario sin marcar, ni explícita ni interpolada — mismo chequeo que ya bloquea \"Ejecutar por compases\"), además de tener el itinerario armado y al menos una parte con los compases confirmados. El aviso junto al switch explica qué falta."

- version: "1.10.3"
  date: "2026-07-25"
  changes:
    - type: nuevo
      text: "Publicar/despublicar una parte (partitura) — de su propio dueño, del dueño de la obra a la que está adjunta, o de un admin. Le da al dueño de la obra la potestad de aceptar o rechazar una parte que subió otro usuario: mientras esté despublicada, no aparece en la lista de partes de la obra ni se puede elegir para seguir en la ejecución para nadie más (su propio dueño y el dueño de la obra la siguen viendo)."
    - type: nuevo
      text: "Una obra no se puede publicar (switch deshabilitado, con aviso) hasta que esté completa: tenga un itinerario armado y al menos una parte con los compases confirmados — evita confundir a quien la encuentre en la biblioteca sin poder practicarla todavía. Despublicar sigue permitido siempre."

- version: "1.10.2"
  date: "2026-07-25"
  changes:
    - type: mejorado
      text: "El botón Publicar/Despublicar de una obra pasó a ser un switch bien visible junto al título (antes era un botón más, mezclado con el resto de las acciones y fácil de pasar por alto) — sigue siendo sólo para el dueño o un admin."

- version: "1.10.1"
  date: "2026-07-25"
  changes:
    - type: nuevo
      text: "Publicar/despublicar una obra (el dueño o un admin) — una obra despublicada no aparece en la biblioteca para nadie más, y tampoco se puede entrar a su ficha ni practicarla por URL directa. El dueño y los admins la siguen viendo (con un aviso \"Despublicada\"); un admin ve y puede publicar/despublicar cualquier obra."
    - type: nuevo
      text: "Crear una obra nueva pasa a ser sólo para administradores, por ahora — el formulario (en la biblioteca y en la ficha de una parte suelta) queda oculto para el resto."
    - type: mejorado
      text: "Al abrir la app (`/`) ya no se pasa por una pantalla de bienvenida con un botón \"Ir a la biblioteca\" — va directo a la biblioteca."
    - type: mejorado
      text: "El botón \"Navegador\" pasa a llamarse \"Practicar\" (también la URL: .../practicar/ en vez de .../navegador/), se movió arriba de todo en la ficha de la obra (antes de \"Volver a Obras\") y quedó destacado. También se agregó en la pantalla de estado de una parte suelta/parte de una obra — antes ahí sólo se podía ver el PDF original sin forma de practicar; al entrar desde ahí queda preseleccionada esa parte."
    - type: corregido
      text: "Con el metrónomo visual apagado, el círculo numerado que marca el pulso sobre la partitura seguía dibujándose y moviéndose igual (sólo se le apagaba el destello) — ahora no se dibuja nada, sin afectar el recuadro del compás actual ni la cuenta al aire."
    - type: corregido
      text: "El modo (compás/partitura) del navegador no se guardaba — cada carga volvía a arrancar en partitura (desktop) o compás (mobile) según el ancho de pantalla, ignorando la última elección. Ahora se recuerda como el resto de las preferencias (parte seguida, velocidad, zoom, fuente de temporización)."
    - type: nuevo
      text: "Cada obra ahora registra cuándo fue modificada de verdad (su itinerario o sus marcas de tiempo por compás — no cambia por preferencias de cada usuario), y se muestra junto a la fecha de creación en cada tarjeta de la biblioteca."

- version: "1.10.0"
  date: "2026-07-25"
  changes:
    - type: mejorado
      text: "La interpolación de tiempos en \"Sincronizar compases\" (botón Interpolar) y el cálculo en vivo de la fuente \"por compases\" durante la ejecución ahora reparten el tiempo real entre dos marcas siguiendo la curva de bpm/acelerando/ritardando calculada del itinerario, en vez de repartirlo en partes iguales por cantidad de pulsos — un acelerando notado en el itinerario ya no queda aplanado en los tramos sin marcar compás a compás."
    - type: mejorado
      text: "La fuente \"por itinerario\" tenía el mismo problema de fondo: sólo escalaba el tiempo calculado contra el borde de la fila actual y el de la fila vecina — marcar únicamente el arranque y el final reales de la obra en \"Sincronizar tiempos\", sin tocar ninguna fila intermedia, no servía de nada. Ahora busca la marca de arranque de fila más cercana cruzando huecos de filas sin marcar (mismo criterio que \"por compases\"), así esos dos puntos alcanzan para estirar proporcionalmente todo el tramo del medio — útil para compensar preparación/aplausos al principio y al final de una grabación."
    - type: nuevo
      text: "\"Ejecutar\"/\"Continuar\" con la fuente \"por compases\" ahora se bloquean, con un aviso que lista los compases afectados, si queda algún compás del rango sin ninguna temporización real (ni marcada ni interpolada) — antes esos huecos avanzaban en silencio con duración 0. Siempre se puede destrabar completando la temporización con Interpolar."
    - type: mejorado
      text: "En \"Sincronizar compases\", el tiempo calculado de cada fila ahora se muestra en formato m:ss.dd (antes, segundos crudos) y se agregó un segundo valor al lado (\"/\"): el mismo cálculo pero anclado al último tiempo real conocido (el compás anterior) en vez de arrastrado desde el principio de la obra — mucho más útil para detectar de un vistazo si el tempo local se aleja de lo calculado. También se agregó el \"bpm real\" medido entre cada compás y el siguiente, para comparar contra el bpm nominal del itinerario."

- version: "1.9.2"
  date: "2026-07-24"
  changes:
    - type: mejorado
      text: "En \"Sincronizar compases\", el panel de partitura ahora muestra también el sistema ANTERIOR al que se está marcando (antes sólo mostraba el actual y los siguientes) — de paso queda más alto, más cómodo de leer."

- version: "1.9.1"
  date: "2026-07-24"
  changes:
    - type: corregido
      text: "En \"Sincronizar compases\", avanzar con Marcar/Saltear/Deshacer no vaciaba la selección de ajuste fino (el recuadro azul) del último compás clickeado a mano — quedaba pegado ahí, y como el panel de partitura prioriza la selección sobre lo armado para decidir qué mostrar, la ventana de partitura tampoco avanzaba en modo marcado (en modo reproducción sí, porque ese modo no depende de la selección)."

- version: "1.9.0"
  date: "2026-07-24"
  changes:
    - type: corregido
      text: "La temporización \"por compases\" (marcas reales de audio) durante la ejecución no podía calcular el tiempo real de un compás que viviera solo en su propia fila del itinerario (por ejemplo, un compás de anacrusis) — sólo miraba las marcas dentro de la fila actual, así que un compás vecino marcado en la fila siguiente quedaba invisible para interpolar. Si ese era el primer compás de la obra (el caso más común), \"Ejecutar con audio\" no podía arrancar el audio en absoluto. Ahora las marcas de compás se leen para la obra entera, cruzando filas del itinerario, igual que ya hacía la interpolación persistida de \"Sincronizar compases\"."

- version: "1.8.0"
  date: "2026-07-24"
  changes:
    - type: corregido
      text: "Se dejó de generar el PDF \"normalizado\" (una copia completa de la partitura con la rotación/enderezado ya aplicados, que se armaba al confirmar la orientación). Nunca se volvía a usar en ningún paso posterior — todo el resto del proceso (márgenes, sistemas, ancla, barras, y el recorte de compases al navegar/sincronizar) siempre rasterizó de nuevo el PDF original aplicando la corrección guardada, así que ese archivo se calculaba y se guardaba en vano. Además tenía un problema de compresión (cada página quedaba embebida sin comprimir, a veces >20 MB por página) que lo hacía pesar muchísimo más de lo necesario. Sacarlo también agiliza el paso de confirmar orientación, que ya no tiene que armar y grabar ese archivo."

- version: "1.7.3"
  date: "2026-07-23"
  changes:
    - type: mejorado
      text: "Reformulación completa de \"Sincronizar compases\": ahora recuerda la parte elegida y arranca siempre en el compás 1 (se completa solo si faltaba). Las marcas ya no son todas iguales: una tapeada a mano queda \"explícita\", una completada por interpolación queda diferenciada visualmente (atenuada) y deja de servir de referencia para futuras interpolaciones si no se la vuelve a tapear a mano. Nueva interpolación persistida (botón \"Interpolar\"): rellena un tramo seleccionado repartiendo el tiempo proporcional a la cantidad de pulsos de cada compás, avisando cuáles no pudo resolver por faltar una marca real de referencia a algún lado. Nuevo borrado en lote de temporización sobre la selección. Seleccionar un compás (clic, Shift+clic, Ctrl+clic o el control deslizante de audio) reposiciona la partitura en el primer compás de la selección, sin depender de cuál quedó armado para marcar. El reproductor pasa a un esquema Play/Pausar/Continuar/Reiniciar (igual que en Ejecución): siempre arranca 2 compases antes del punto elegido, para tener contexto musical antes de escuchar/marcar."
    - type: corregido
      text: "En \"Sincronizar compases\", mover el control deslizante de audio posicionaba la partitura pero no dejaba realmente armado el compás para marcar, y por eso tampoco hacía scroll para llevarlo a la vista en la lista — ahora arma el compás correspondiente en los dos modos."
    - type: nuevo
      text: "En el paso de detección de orientación de una partitura, botón \"Omitir detección automática\" para saltar directo al ajuste manual — la detección puede demorar mucho o fallar por timeout con varias páginas, y no siempre hace falta: el usuario puede ajustar a mano sin esperarla."

- version: "1.7.0"
  date: "2026-07-23"
  changes:
    - type: mejorado
      text: "Ejecución reformulada completa: la temporización del cursor/sombreado ahora se elige explícitamente entre itinerario o compases (antes iba mezclado con \"Ejecutar con audio\", que ahora sólo controla si suena el audio de referencia y nunca se mezcla con la otra fuente), con un switch nuevo que recuerda la elección. La barra de controles quedó más compacta en los dos modos (compás y partitura): botones sólo con ícono, textos arriba de cada control (como en el rango), y en pantallas chicas el modo compás pasa a ser el default. El número de compás grande se puede editar en pausa para saltar directo a otro (con marcado visual sobre la partitura, igual que al hacer clic en un compás). \"Continuar\" vuelve a pedir el plan de ejecución en vez de ignorar cambios de rango hechos durante la pausa. De paso, las pantallas de marcado se renombraron a \"Sincronizar itinerario\"/\"Sincronizar compases\" para que los nombres coincidan en toda la app."

- version: "1.6.0"
  date: "2026-07-21"
  changes:
    - type: nuevo
      text: "Las obras dejan de ser privadas para navegar: cualquier usuario logueado que tenga el link puede ver la ficha, elegir qué parte seguir y ejecutar/navegar, sin ser el dueño. También puede cargar su propia parte a esa obra (con su propio dueño, independiente del de la obra) y editarla o borrarla — pero no la de otro. Lo que sigue siendo exclusivo del dueño de la obra: borrar la obra, el itinerario, el audio de referencia y sincronizar tiempos."
    - type: nuevo
      text: "Se puede editar el título, compositor, instrumento y parte de una partitura ya adjunta a una obra directamente desde la ficha de la obra (antes sólo se llegaba ahí desde \"Partes sueltas\")."
    - type: nuevo
      text: "La biblioteca ahora muestra las obras de TODOS los usuarios, no sólo las propias — cada tarjeta indica \"tuya\" o el nombre de quien la creó."
    - type: corregido
      text: "En la ficha de una obra, hacer clic en una parte que no era propia daba error (como si no existiera). Ahora se puede ver el estado de cualquier parte; sólo quien la subió ve los botones para editarla o reprocesarla."
    - type: mejorado
      text: "Las obras (en la biblioteca), las partes (dentro de cada obra) y el selector de parte del navegador ahora se listan en orden alfabético."
    - type: mejorado
      text: "Repaso de los datos de una parte: el título ya no se puede editar si la parte pertenece a una obra (usa el de la obra); si no se cargó un nombre de parte se muestra el instrumento en su lugar; el instrumento pasa a ser obligatorio; se sacó el campo de compositor por parte (ya está a nivel obra); y al cargar una parte, el selector de archivo va inmediatamente después del título."
    - type: corregido
      text: "El ancla detectada automáticamente podía quedar mucho más baja que el pentagrama real (una barra de compás casi nunca es perfectamente vertical, y la medición seguía una única columna de píxeles en vez de tolerar ese desvío) — el rectángulo del ancla ahora cubre la altura real de la barra."
    - type: mejorado
      text: "Pantalla \"Ajustar sistemas\": el botón de agregar ahora deja elegir dónde con un clic sobre la partitura, en vez de agregarlo siempre al final. Se puede mover un sistema completo arrastrando su centro (antes sólo se podían redimensionar los bordes), y duplicar uno existente (se ubica desplazado del original para poder distinguirlos, y después se mueve a su posición final arrastrándolo)."
    - type: corregido
      text: "El orden alfabético de las partes (dentro de una obra, en partes sueltas y en el selector del navegador) no quedaba bien cuando no tenían nombre de parte cargado: se ordenaba por ese campo vacío en vez de por el instrumento que termina mostrándose en su lugar."
    - type: mejorado
      text: "En la ficha de una obra: la sección de \"Partes\" (que puede ser larga) se movió después del audio de referencia y los botones de ejecución/sincronización, y \"Borrar obra\" queda al final, separado. Borrar una obra ahora exige escribir \"borrar <nombre de la obra>\" exactamente antes de habilitar el botón, en vez de un cuadro de confirmación del navegador."
    - type: mejorado
      text: "Al ejecutar una obra con el audio de referencia, el sonido del metrónomo arranca silenciado por default (se puede reactivar igual) — sonar junto con la música real quedaba mal."
    - type: mejorado
      text: "El aviso del próximo compás (el que va a cambiar la ventana de la partitura) ahora aparece hasta 4 compases antes, no recién en el último — cuando hay margen para eso; si el tramo es corto, avisa apenas se pueda. Además ahora identifica correctamente CUÁL es ese compás (el que hace falta que cambie la ventana, no siempre el inmediato siguiente) y lo mantiene fijo durante toda la anticipación."
    - type: corregido
      text: "Cuando el rango arrancaba cerca del final de una página, la ventana podía quedar con un solo sistema visible y el aviso de próximo compás no tenía dónde mostrarse (necesitaba un segundo sistema adyacente). Ahora en ese caso usa el espacio libre que queda debajo, dentro del mismo panel, al mismo tamaño con el que se lee el resto de la partitura (no estirado para ocupar todo ese espacio)."
    - type: corregido
      text: "Cambiar la velocidad de reproducción no tenía efecto real al ejecutar con el audio de referencia: el audio sonaba siempre a su ritmo original, sólo la cuenta al aire respetaba la velocidad elegida. Ahora también se le aplica al audio."
    - type: nuevo
      text: "Botón junto al slider de velocidad para volver directo a 100%."
    - type: mejorado
      text: "En modo partitura, \"Ejecutar con audio\" y \"Silenciar\" se movieron a la fila compacta de arriba, a continuación del bpm y el metrónomo (antes estaban en la otra fila, junto a Ejecutar/rango/zoom)."
    - type: nuevo
      text: "Botón \"Detener\": corta la ejecución y vuelve al estado inicial sin volver a arrancar sola (a diferencia de \"Reiniciar\", que sí arranca). Antes, una vez elegido \"Ejecutar con audio\" no había forma de cambiarlo sin recargar la página — ese campo (y otros que sólo se pueden tocar antes de arrancar) sólo se habilita en el estado inicial."

- version: "1.5.2"
  date: "2026-07-21"
  changes:
    - type: corregido
      text: "En \"Sincronizar por compás\", marcar, deshacer, editar a mano o usar el ajuste fino no actualizaba el plan que usa el seguimiento \"sonando\"/modo Reproducción — el ajuste quedaba invisible ahí hasta recargar la página."
    - type: corregido
      text: "La lista de compases scrolleaba de más (llevaba la fila arriba de todo aunque ya estuviera visible) y de menos (no scrolleaba cuando la fila activa dejaba de verse) — ahora sólo scrollea cuando hace falta, y en ese caso la lleva arriba de todo en vez de dejarla apenas asomando."
    - type: mejorado
      text: "Los botones de ajuste fino (±0,1s/±0,05s) ahora tienen fondo rojo o verde según retroceden o avanzan el tiempo, con más intensidad en el paso grande (0,1s) que en el chico (0,05s)."

- version: "1.5.1"
  date: "2026-07-21"
  changes:
    - type: mejorado
      text: "En \"Sincronizar por compás\", los comandos de marcado (Marcar/Saltear/Deshacer) y el ajuste fino se movieron de la tarjeta del reproductor a la de la lista de compases — lo que ajustan son las marcas de la lista, no la reproducción del audio en sí."

- version: "1.5.0"
  date: "2026-07-21"
  changes:
    - type: nuevo
      text: "Sincronización con audio real: subí una grabación de referencia por obra y completá Segmento.tiempo_inicio escuchándola, en vez de escribir segundos a mano. Dos formas, que conviven: por fila del itinerario (\"Sincronizar tiempos\") o compás a compás con repeticiones (\"Sincronizar por compás\", nueva) — tap con Espacio, Tab salta un compás sin marcarlo, click en cualquiera para corregir, edición manual, controles finos de audio (±0,1s/±1s), modo Marcado/Reproducción, selección múltiple con ajuste fino (corre varias marcas la misma fracción de segundo), y resaltado en verde/rojo/azul (sonando/próximo a marcar/seleccionado) tanto en la lista como en la partitura."
    - type: nuevo
      text: "\"Ejecutar con audio\" en el navegador: el audio de referencia gobierna el cursor en tiempo real mientras suena, en vez del tempo calculado — prioriza automáticamente la marca más precisa disponible en cada tramo (compás > fila > tiempo calculado) sin tener que elegir a mano. Con silenciar aparte, para seguir el tiempo real sin escuchar la grabación."
    - type: nuevo
      text: "Click sobre cualquier compás visible de la partitura, durante la ejecución en el navegador, para posicionarse ahí directo (pausa si estaba corriendo, y reubica el audio real si \"Ejecutar con audio\" está activo)."
    - type: nuevo
      text: "Números de compás visibles sobre la partitura, con switch para mostrarlos u ocultarlos — en las pantallas de sincronización y en el navegador de ejecución."
    - type: nuevo
      text: "La biblioteca pasa a ser una biblioteca de OBRAS: cargar una parte nueva siempre se hace desde la ficha de la obra (ya no hay carga suelta). Borrar una obra borra también sus partes de verdad, con confirmación que avisa cuántas. Las partes que igual queden sueltas (al separarlas, o si ya existían de antes) se ven y se pueden borrar aparte, en \"Partes sueltas\"."
    - type: nuevo
      text: "Velocidad de ejecución ampliada de 120% a 150%, con una marca fija en 100% sobre el slider para volver rápido al tempo original."
    - type: mejorado
      text: "El menú de navegación no se podía abrir en pantallas chicas (faltaba el botón para desplegarlo en mobile)."
    - type: mejorado
      text: "Los archivos (PDFs, audio) se limpian solos del servidor al borrar una parte o una obra, sin importar por dónde se borre — antes sólo pasaba si se usaba el botón de la app; borrar desde el admin de Django dejaba los archivos huérfanos en el servidor."
    - type: corregido
      text: "El audio de referencia no se podía buscar/seekear de verdad durante la ejecución ni en las pantallas de sincronización — el servidor de desarrollo nunca soportó pedidos de rango (\"Range requests\"), así que aunque se reposicionara el reproductor, la reproducción arrancaba siempre desde el principio del archivo."
    - type: corregido
      text: "El botón de borrar una obra no pedía confirmación — un error de comillas en el mensaje de confirmación rompía el chequeo del lado del navegador, que quedaba ignorado en silencio."

- version: "1.4.0"
  date: "2026-07-20"
  changes:
    - type: nuevo
      text: "El navegador recuerda, por usuario y por obra, el rango desde/hasta, loop, velocidad, compases al aire y la última parte elegida — se autoguarda solo (sin botón) cada vez que se cambia algo, y precompleta todo eso la próxima vez que se entra en vez de arrancar de cero. Un link explícito (ej. Anterior/Siguiente, uno compartido) sigue ganándole a lo guardado."
    - type: nuevo
      text: "El zoom preferido también se recuerda, pero por parte (no por obra) — cada parte puede necesitar un nivel distinto según su propia diagramación."
- version: "1.3.5"
  date: "2026-07-20"
  changes:
    - type: mejorado
      text: "El cambio de ventana en la ejecución con score ya no se adelanta 1 pulso antes de que termine el último compás visible — espera a que ese compás realmente termine de sonar antes de saltar a la próxima."
    - type: corregido
      text: "Un salto (a coda, repetición, etc.) que se anunciaba estando todavía en el primer sistema de una ventana recién mostrada no tenía dónde pintar la vista previa del próximo compás — ahora, si no hay sistema anterior disponible, usa el segundo en su lugar."

- version: "1.3.4"
  date: "2026-07-20"
  changes:
    - type: corregido
      text: "Guardar el itinerario podía romper con «llave duplicada... orden» al tocar una sola fila — el rango temporal que usa la vista para evitar colisiones coincidía con el que usa internamente renumerar_segmentos(), y se pisaban entre sí."
    - type: nuevo
      text: "La fila de cierre del itinerario (sin Desde/Hasta, sólo marca dónde termina el último compás real y muestra el tiempo estimado de fin de la obra) se agrega sola al guardar si todavía no existe — antes había que armarla a mano sin ninguna guía."
    - type: corregido
      text: "La fila de cierre podía terminar encajada en el medio de la tabla si una fila nueva se guardaba con un número de orden más alto que el suyo (fácil de tipear sin querer, no se distingue a simple vista salvo por tener Desde/Hasta vacíos) — y todo lo que quedara después se perdía en silencio del cálculo de tiempos. Ahora la fila de cierre siempre queda última al guardar, sin importar qué orden se le haya tipeado a las demás."
    - type: corregido
      text: "Cambiarle el orden a una sola fila para que pasara antes que las demás (ej. ponerle 5 para que vaya antes que la primera) no hacía nada — se calculaba su nueva posición sólo contra las otras filas tocadas en ese guardado, ignorando dónde debía quedar respecto de las que no se habían tocado."
    - type: corregido
      text: "El tiempo calculado de la primera fila aparecía como «—» en vez de 0:00:00 — el filtro del template trataba cualquier valor \"falsy\" (incluido un tiempo de exactamente cero) como si faltara."
    - type: nuevo
      text: "Obra, Segmento y Barra ahora están dados de alta en el admin de Django (antes sólo Partitura/Página/Sistema/Compás)."

- version: "1.3.3"
  date: "2026-07-20"
  changes:
    - type: nuevo
      text: "Borrar una partitura desde la biblioteca (con confirmación, avisando si está vinculada a una obra) — borra también sus archivos del servidor, no sólo el registro."
    - type: nuevo
      text: "Editar título, compositor, instrumento y parte de una partitura ya subida, desde la biblioteca — no permite cambiar el archivo, para no invalidar lo ya detectado y confirmado."

- version: "1.3.2"
  date: "2026-07-20"
  changes:
    - type: nuevo
      text: "Compases al aire (optativo, default 1) antes de la ejecución en tiempo real, con cuenta regresiva desde el número de pulsos hasta 1 en cada uno para fijar la atención. Vuelven a sonar cada vez que se retoma tras una pausa, no sólo al arrancar. Se avisan con un número grande propio en el margen del sistema (no el cursor de pulso normal, para no confundirlos con la obra ya empezada) y siempre visibles; el sonido respeta el switch de metrónomo."

- version: "1.3.1"
  date: "2026-07-20"
  changes:
    - type: nuevo
      text: "Control de velocidad para la ejecución en tiempo real (20%-120% del tempo original), con slider junto al botón de Ejecutar/Pausar/Continuar. Se puede ajustar en cualquier momento: si está sonando, tocarlo pausa automáticamente antes de aplicar el cambio; en pausa, el nuevo valor se aplica al toque, listo para retomar con Continuar."

- version: "1.3.0"
  date: "2026-07-20"
  changes:
    - type: nuevo
      text: "El rango desde/hasta del navegador acepta un pulso puntual (ej. 5,1.3 = compás 5, pulso 1 más 3 décimos), no sólo el compás entero."
    - type: nuevo
      text: "Atajos de teclado durante la ejecución: Espacio pausa/continúa, flechas izquierda/derecha van a Anterior/Siguiente."
    - type: nuevo
      text: "Logo propio de ScoreSync (favicon) y logo de Infedu-jch con link a infedu.com.ar en el pie de página."
    - type: mejorado
      text: "El recuadro que marca el compás actual se recorta proporcionalmente cuando sólo se va a tocar una parte de él (arranca o corta a mitad de pulso)."
    - type: mejorado
      text: "En modo partitura, el metrónomo visual y el sonido quedan accesibles en la barra compacta; el cursor de pulso sobre el score hace de indicador visual en cada pulso, sin un recuadro aparte."
    - type: mejorado
      text: "En modo partitura, Ejecutar/Pausar/Continuar/Reiniciar se reubicaron junto al rango y Anterior/Siguiente; los botones de navegación tienen forma de tecla de teclado."
    - type: corregido
      text: "El recorte y el cursor sobre el primer compás de cada sistema quedaban corridos por un dato de geometría (arranca en x=0, antes del margen real de la página)."

- version: "1.2.1"
  date: "2026-07-20"
  changes:
    - type: nuevo
      text: "Cursor sobre la partitura durante la ejecución: recorte del compás actual y del siguiente, uno al lado del otro, tomados de la parte correspondiente a la obra."
    - type: mejorado
      text: "Los silencios de varios compases muestran todo el tramo entre barras, con marcas señalando cuál parte corresponde al compás puntual."

- version: "1.2.0"
  date: "2026-07-20"
  changes:
    - type: nuevo
      text: "Navegador del itinerario: recorrer la obra compás a compás (manual o en tiempo real), con rango desde-hasta, repetición de pasada y loop."
    - type: nuevo
      text: "Ejecución en tiempo real con metrónomo visual y auditivo (acento en el primer pulso de cada compás, sonido apagable por separado) y tempo interpolado en los accelerando/ritardando, incluso si arrancan o cortan a mitad de compás."
    - type: nuevo
      text: "Pausar, continuar y reiniciar la ejecución, con Anterior/Siguiente siempre referidos al compás activo."

- version: "1.1.0"
  date: "2026-07-19"
  changes:
    - type: nuevo
      text: "Itinerario de ejecución por obra: tabla editable de tramos (compases, tempo, BPM) con guardado, reordenamiento y renumeración automática."

- version: "1.0.2"
  date: "2026-07-20"
  changes:
    - type: mejorado
      text: "Mejora de interfaz. Secuencia rigurosa."
      
- version: "1.0.1"
  date: "2026-07-19"
  changes:
    - type: nuevo
      text: "Detección automática de silencions múltiples. El usuario indica cuántos son para no tener que usar OCR."

- version: "1.0.0"
  date: "2026-07-18"
  changes:
    - type: nuevo
      text: "Corrección automática y asistida de orientación"
    - type: nuevo
      text: "Detección automática y corrección de márgenes"
    - type: nuevoE
      text: "Detección automática y corrección de sistemas"
    - type: nuevo
      text: "Detección de barras de compás y corrección manual"
    - type: nuevo
      text: "Numeración automática de compases y corrección manual"

- version: "0.1.0"
  date: "2026-07-17"
  changes:
    - type: nuevo
      text: "Base del proyecto: login compartido con afinación/ensayos/tempo, idioma, novedades y solicitud de acceso"
